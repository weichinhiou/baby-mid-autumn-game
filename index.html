<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a3e"><title>寶寶過中秋｜中秋小遊戲</title><meta name="description" content="移動爬行寶寶接住中秋好吃東東，避開炸彈和烤焦的肉串。"><meta property="og:type" content="website"><meta property="og:title" content="寶寶過中秋｜中秋接物小遊戲"><meta property="og:description" content="拖動兔耳寶寶，接月餅、柚子與烤串！30 秒挑戰，手機也能玩。"><meta property="og:image" content="https://weichinhiou.github.io/baby-mid-autumn-game/line-share-v2.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="兔耳寶寶與中秋大月餅的遊戲封面"><meta property="og:url" content="https://weichinhiou.github.io/baby-mid-autumn-game/"><meta name="twitter:card" content="summary_large_image"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23f8c66e'/%3E%3Ctext x='11' y='44' font-size='40'%3E🥮%3C/text%3E%3C/svg%3E"><style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#101a3e;color:#fff;font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif}body{display:grid;place-items:center;padding:12px;overflow:hidden}.wrap{width:min(100%,1000px);display:grid;gap:10px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 4px}.top h1{font-size:clamp(20px,4vw,30px);margin:0;font-weight:800;letter-spacing:.04em}.score{font-size:clamp(17px,3vw,23px);font-weight:800;white-space:nowrap}.score .clock{color:#ffdc8c}.sound{width:48px;height:48px;flex:0 0 auto;border:1px solid #f9d7948c;border-radius:14px;background:#26325d;color:#fff;font-size:25px;cursor:pointer}.sound:focus-visible{outline:3px solid #ffcf70;outline-offset:2px}.game{position:relative;width:min(100%,calc(72dvh * 16 / 9));aspect-ratio:16/9;justify-self:center;border-radius:22px;overflow:hidden;box-shadow:0 16px 50px #0008;border:2px solid #f5d18c88;background:#172448}canvas{display:block;width:100%;height:100%;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#0b1439c9;padding:18px;text-align:center;overflow-y:auto}.overlay[hidden]{display:none}.card{background:#151d46f2;border:1px solid #f9dca7a6;border-radius:24px;padding:clamp(16px,3.6vw,30px);width:min(100%,520px);box-shadow:0 16px 40px #0006}.intro-baby{display:block;width:106px;height:auto;margin:0 auto 10px;image-rendering:pixelated}.intro-baby[hidden]{display:none}.card h2{font-size:clamp(24px,5vw,36px);margin:0 0 12px}.card p{font-size:clamp(15px,2.4vw,18px);line-height:1.55;margin:0 0 16px}.legend[hidden],.result[hidden]{display:none}.result{font-size:clamp(23px,4vw,31px);font-weight:800;color:#fff1b3;line-height:1.4;margin:0 0 22px}.result strong{display:block;font-size:clamp(54px,12vw,84px);line-height:1.15;color:#fff67a;text-shadow:0 0 24px #ffcd55b8}.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 18px;text-align:left}.legend img{width:29px;height:29px;object-fit:contain;flex:none;image-rendering:pixelated}.legend strong{margin-left:auto}.legend span{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:12px;background:#ffffff12;font-size:clamp(14px,2.3vw,17px);white-space:nowrap}.primary{border:0;border-radius:100px;background:#ffcf70;color:#352346;padding:13px 36px;font-size:19px;font-weight:800;cursor:pointer;min-height:50px}.hint span{display:block}.hint{text-align:center;font-size:14px;color:#f1e3c9;margin:0}@media(max-width:700px) and (orientation:portrait){body{padding:8px}.wrap{width:min(100%,430px);gap:8px}.top{display:grid;grid-template-columns:1fr auto;gap:5px}.top h1{grid-column:1/-1}.top .score{grid-column:1}.top .sound{grid-column:2;grid-row:2}.game{width:min(100%,calc((100dvh - 165px) * 9 / 16));aspect-ratio:9/16}.overlay{position:fixed;z-index:10;padding:18px}.hint{font-size:13px}.card{padding:16px}.intro-baby{width:86px}.legend{grid-template-columns:1fr;gap:5px}.legend span{padding:6px 10px;font-size:14px}}@media(max-height:560px) and (orientation:landscape){.game{width:min(100%,calc((100dvh - 105px) * 16 / 9))}.hint{display:none}}</style></head><body><main class="wrap"><header class="top"><h1>🥮 寶寶過中秋</h1><div class="score" aria-live="polite">得分 <span id="score">0</span>　<span class="clock">⏱ <span id="time">30</span>秒</span></div><button class="sound" id="sound" type="button" aria-label="關閉音效" aria-pressed="false">🔊</button></header><section class="game" aria-label="寶寶過中秋遊戲區"><canvas id="scene" width="960" height="540" aria-label="拖動寶寶接住落下的物品"></canvas><div class="overlay" id="overlay"><div class="card"><h2 id="headline">寶寶過中秋！</h2><img class="intro-baby" id="introBaby" src="baby-pixel-fast.webp" alt="戴兔耳帽的爬行寶寶"><p id="message">拖動爬行寶寶，接住落下的好吃東東。<br>時間歸零就結算分數；遊玩滿 30 秒後，每 10 秒加速一階。</p><div class="legend" id="legend"><span><img src="mooncake-icon-fast.webp" alt="">月餅<strong>+1 分</strong></span><span><img src="bomb-icon-fast.webp" alt="">炸彈<strong>−2 分</strong></span><span><img src="skewer-cooked-fast.webp" alt="">烤肉串<strong>+3 秒</strong></span><span><img src="skewer-burnt-fast.webp" alt="">焦烤串<strong>−5 秒</strong></span><span><img src="skewer-raw-fast.webp" alt="">未熟烤串<strong>卡 3 秒</strong></span><span><img src="pomelo-fast.webp" alt="">柚子<strong>+5 分</strong></span></div><div class="result" id="result" hidden>你的得分：<strong id="finalScore">0</strong></div><button class="primary" id="start">開始吃大餐</button></div></div></section><p class="hint"><span>手機：以手指拖動畫面上的寶寶。</span><span>電腦：以滑鼠拖動畫面上的寶寶。</span></p></main><script>
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time');let W=960,H=540,portrait=false;const bg=new Image(),portraitBg=new Image(),baby=new Image(),icons={};for(const [type,file] of Object.entries({cake:'mooncake-icon-fast.webp',bomb:'bomb-icon-fast.webp',good:'skewer-cooked-fast.webp',raw:'skewer-raw-fast.webp',burnt:'skewer-burnt-fast.webp',pomelo:'pomelo-fast.webp'})){const img=new Image();img.src=file;img.onload=()=>draw(performance.now());icons[type]=img}bg.src='mooncake-fast.webp';portraitBg.src='mooncake-portrait-fast.webp';baby.src='baby-pixel-fast.webp';let state='ready',x=480,target=null,dragOffset=0,keyboard=0,items=[],particles=[],points=0,time=30,elapsed=0,speedLevel=0,stun=0,spawn=0,last=0,animation=0,feedback=[];const choices=[{type:'cake',weight:44,emoji:'🥮',label:'+1分',color:'#ffe4a5'},{type:'bomb',weight:15,emoji:'💣',label:'−2分',color:'#f5a8a8'},{type:'good',weight:12,emoji:'🍢',label:'+3秒',color:'#a7f3c7'},{type:'burnt',weight:10,emoji:'🔥',label:'−5秒',color:'#ff9d78'},{type:'raw',weight:10,emoji:'🍢',label:'卡3秒',color:'#cbb4ff'},{type:'pomelo',weight:9,emoji:'🍈',label:'+5分',color:'#ccfa79'}];
const soundButton=document.getElementById('sound');let muted=false,audioCtx=null;
function ensureAudio(){if(muted)return;try{if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx=new AC()}if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{})}catch(e){audioCtx=null}}
function tone(freq,duration,delay,wave='sine',volume=.12,endFreq=freq){if(!audioCtx||muted||audioCtx.state!=='running')return;const t=audioCtx.currentTime+delay,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=wave;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,endFreq),t+duration);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(volume,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+duration+.01)}
function playCatch(type){if(muted)return;switch(type){case 'cake':tone(660,.11,0,'sine',.13);tone(880,.14,.09,'sine',.1);break;case 'bomb':tone(160,.38,0,'sawtooth',.1,48);tone(80,.3,.04,'triangle',.09,42);break;case 'good':tone(523,.12,0,'triangle',.11);tone(659,.12,.1,'triangle',.11);tone(784,.22,.2,'triangle',.12);break;case 'burnt':tone(300,.16,0,'square',.055,190);tone(180,.26,.15,'square',.045,90);break;case 'raw':tone(350,.18,0,'triangle',.085,270);tone(294,.22,.17,'triangle',.075,220);tone(247,.22,.34,'triangle',.06,200);break;case 'pomelo':tone(740,.1,0,'sine',.12);tone(988,.12,.08,'sine',.11);tone(1175,.21,.17,'sine',.1);break}}
soundButton.addEventListener('click',()=>{muted=!muted;soundButton.textContent=muted?'🔇':'🔊';soundButton.setAttribute('aria-label',muted?'開啟音效':'關閉音效');soundButton.setAttribute('aria-pressed',String(muted));if(!muted)ensureAudio()});
function choose(){let n=Math.random()*100;return choices.find(c=>(n-=c.weight)<0)||choices[0]}function start(){ensureAudio();cancelAnimationFrame(animation);setLayout();state='play';x=W/2;target=null;keyboard=0;document.getElementById('introBaby').hidden=false;items=[];feedback=[];points=0;time=30;elapsed=0;speedLevel=0;stun=0;spawn=.4;document.getElementById('headline').textContent='寶寶過中秋！';document.getElementById('message').hidden=false;document.getElementById('legend').hidden=false;document.getElementById('result').hidden=true;scoreEl.textContent='0';timeEl.textContent='30';overlay.hidden=true;last=performance.now();animation=requestAnimationFrame(frame)}function end(){state='end';keyboard=0;document.getElementById('introBaby').hidden=true;document.getElementById('headline').textContent='好飽喔~中秋節快樂!!';document.getElementById('message').hidden=true;document.getElementById('legend').hidden=true;document.getElementById('finalScore').textContent=points;document.getElementById('result').hidden=false;document.getElementById('start').textContent='再玩一次';overlay.hidden=false}document.getElementById('start').addEventListener('click',start);
function catchItem(it){playCatch(it.type);if(it.type==='cake')points+=1;if(it.type==='bomb')points-=2;if(it.type==='good')time+=3;if(it.type==='burnt')time=Math.max(0,time-5);if(it.type==='raw'){stun=3;target=null;keyboard=0}if(it.type==='pomelo')points+=5;scoreEl.textContent=points;timeEl.textContent=Math.ceil(time);feedback.push({x:it.x,y:it.y-20,text:it.label,color:it.color,life:1})}
function frame(now){if(state!=='play')return;const dt=Math.min((now-last)/1000,.05);last=now;elapsed+=dt;const nextLevel=Math.max(0,Math.floor(elapsed/10)-2);if(nextLevel>speedLevel){speedLevel=nextLevel;feedback.push({x:W/2,y:portrait?180:135,text:'速度提升！',color:'#ffe39d',life:1.5})}time=Math.max(0,time-dt);if(time<=0){timeEl.textContent='0';end();draw(now);return}timeEl.textContent=Math.ceil(time);stun=Math.max(0,stun-dt);if(stun<=0&&target!==null)x+=(target-x)*Math.min(1,dt*15);else if(stun<=0)x+=(keyboard*(portrait?360:480))*dt;x=Math.max(85,Math.min(W-85,x));spawn-=dt;if(spawn<=0){let kind=choose();items.push({x:55+Math.random()*(W-110),y:-55,speed:(portrait?305:205)+Math.random()*(portrait?95:75),kind,phase:Math.random()*6});spawn=.45+Math.random()*.25}for(let i=items.length-1;i>=0;i--){const it=items[i];it.y+=it.speed*(1+speedLevel*.16)*dt;it.x+=Math.sin(now/420+it.phase)*dt*13;if(it.y>playerY()-88&&it.y<playerY()+30&&Math.abs(it.x-x)<70){catchItem({...it,type:it.kind.type,label:it.kind.label,color:it.kind.color});items.splice(i,1)}else if(it.y>H+60)items.splice(i,1)}feedback=feedback.filter(f=>(f.life-=dt*1.3)>0);draw(now);if(time<=0){timeEl.textContent='0';end();return}animation=requestAnimationFrame(frame)}
function playerY(){return H-(portrait?95:70)}function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}function draw(now){ctx.clearRect(0,0,W,H);const sceneBg=portrait?portraitBg:bg;if(sceneBg.complete&&sceneBg.naturalWidth){let sw=sceneBg.naturalWidth,sh=sceneBg.naturalHeight,scale=Math.max(W/sw,H/sh),cw=W/scale,ch=H/scale;ctx.drawImage(sceneBg,(sw-cw)/2,(sh-ch)/2,cw,ch,0,0,W,H)}else{ctx.fillStyle='#172448';ctx.fillRect(0,0,W,H)}ctx.fillStyle='#10183932';ctx.fillRect(0,0,W,H);if(state==='play'){ctx.fillStyle='#172448dc';rounded(16,16,122,39,12);ctx.fill();ctx.fillStyle='#ffe2a0';ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.fillText('速度 Lv.'+(speedLevel+1),77,42);if(stun>0){ctx.fillStyle='#332455dd';rounded(W-165,16,149,39,12);ctx.fill();ctx.fillStyle='#f4d3ff';ctx.fillText('卡住 '+stun.toFixed(1)+' 秒',W-91,42)}}for(const it of items){ctx.save();ctx.translate(it.x,it.y);ctx.shadowColor=it.kind.color;ctx.shadowBlur=18;ctx.fillStyle='#192244e8';ctx.strokeStyle=it.kind.color;ctx.lineWidth=3;rounded(-39,-44,78,88,20);ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.textAlign='center';const icon=icons[it.kind.type];if(icon&&icon.complete&&icon.naturalWidth){ctx.imageSmoothingEnabled=false;ctx.drawImage(icon,-32,-42,64,62);ctx.imageSmoothingEnabled=true}else{ctx.font='43px serif';ctx.fillText(it.kind.emoji,0,8)}ctx.font='bold 16px system-ui';ctx.fillStyle=it.kind.color;ctx.fillText(it.kind.label,0,31);ctx.restore()}ctx.save();ctx.shadowColor='#ffd783';ctx.shadowBlur=18;if(baby.complete&&baby.naturalWidth){const w=190,h=w*baby.naturalHeight/baby.naturalWidth;ctx.imageSmoothingEnabled=false;ctx.drawImage(baby,x-w/2,playerY()-h/2,w,h);ctx.imageSmoothingEnabled=true}else{ctx.textAlign='center';ctx.font='100px serif';ctx.fillText('👶',x,playerY())}ctx.restore();for(const f of feedback){ctx.globalAlpha=f.life;ctx.fillStyle=f.color;ctx.strokeStyle='#1e224c';ctx.lineWidth=5;ctx.font='bold 30px system-ui';ctx.textAlign='center';ctx.strokeText(f.text,f.x,f.y-(1-f.life)*40);ctx.fillText(f.text,f.x,f.y-(1-f.life)*40);ctx.globalAlpha=1}}
function setLayout(){const ratio=Math.min(window.devicePixelRatio||1,3);const next=matchMedia('(max-width:700px) and (orientation:portrait)').matches;if(next===portrait&&canvas.width===Math.round(W*ratio))return;const oldW=W,oldH=H;portrait=next;W=next?540:960;H=next?960:540;x=x/oldW*W;items.forEach(it=>{it.x=it.x/oldW*W;it.y=it.y/oldH*H;it.speed=it.speed/oldH*H});target=null;canvas.width=Math.round(W*ratio);canvas.height=Math.round(H*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);draw(performance.now())}addEventListener('resize',setLayout);function pointerX(e){const rect=canvas.getBoundingClientRect();return (e.clientX-rect.left)/rect.width*W}function pointerY(e){const rect=canvas.getBoundingClientRect();return (e.clientY-rect.top)/rect.height*H}canvas.addEventListener('pointerdown',e=>{if(state!=='play'||stun>0||Math.abs(pointerX(e)-x)>110||Math.abs(pointerY(e)-playerY())>100)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);dragOffset=x-pointerX(e);target=x;keyboard=0});canvas.addEventListener('pointermove',e=>{if(state==='play'&&stun<=0&&canvas.hasPointerCapture(e.pointerId)){e.preventDefault();target=pointerX(e)+dragOffset}});canvas.addEventListener('pointerup',e=>{if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);target=null});canvas.addEventListener('pointercancel',()=>target=null);canvas.addEventListener('lostpointercapture',()=>target=null);addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key)){e.preventDefault();if(stun>0)return;target=null;keyboard=-1}else if(['ArrowRight','d','D'].includes(e.key)){e.preventDefault();if(stun>0)return;target=null;keyboard=1}});addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key)&&keyboard===-1)keyboard=0;if(['ArrowRight','d','D'].includes(e.key)&&keyboard===1)keyboard=0});addEventListener('blur',()=>{keyboard=0;target=null});baby.onload=()=>draw(0);bg.onload=()=>draw(0);portraitBg.onload=()=>draw(0);setLayout();draw(0);
</script></body></html>
